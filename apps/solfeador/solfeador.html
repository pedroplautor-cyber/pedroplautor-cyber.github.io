<script>
    const noteNamesES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
    const targetNotes = [
        { name: "Do", freq: 261.63 }, { name: "Re", freq: 293.66 },
        { name: "Mi", freq: 329.63 }, { name: "Fa", freq: 349.23 },
        { name: "Sol", freq: 392.00 }, { name: "La", freq: 440.00 },
        { name: "Si", freq: 493.88 }
    ];

    let audioCtx = null;
    let analyser = null;
    let currentTarget = null;
    let buffer = new Float32Array(2048);

    document.getElementById('btnMain').addEventListener('click', async () => {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Pedimos el micro de forma más abierta para evitar bloqueos de sistema
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                
                document.getElementById('statusText').innerText = "¡Conectado! Canta fuerte.";
                render();
            } catch (err) {
                alert("Error técnico: " + err.name);
            }
        }
        
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        currentTarget = targetNotes[Math.floor(Math.random() * targetNotes.length)];
        document.getElementById('targetNoteDisplay').innerText = currentTarget.name;
    });

    function render() {
        requestAnimationFrame(render);
        analyser.getFloatTimeDomainData(buffer);
        
        // Calculamos el volumen (RMS) para ver si llega señal
        let rms = 0;
        for (let i = 0; i < buffer.length; i++) { rms += buffer[i] * buffer[i]; }
        let volume = Math.sqrt(rms / buffer.length);

        // Si el volumen es mayor a 0.005 (muy sensible), intentamos detectar tono
        if (volume > 0.005) {
            const freq = autoCorrelate(buffer, audioCtx.sampleRate);
            if (freq !== -1 && freq > 60 && freq < 1200) {
                const n = 12 * Math.log2(freq / 440) + 69;
                const noteIndex = Math.round(n) % 12;
                document.getElementById('userNoteDisplay').innerText = noteNamesES[(noteIndex + 12) % 12];
                document.getElementById('freqDisplay').innerText = Math.round(freq) + " Hz";

                if (currentTarget) {
                    const cents = 1200 * Math.log2(freq / currentTarget.freq);
                    let visualPos = 50 + (cents / 2); 
                    visualPos = Math.max(5, Math.min(95, visualPos));
                    document.getElementById('pointer').style.left = visualPos + "%";
                    document.getElementById('pointer').style.backgroundColor = Math.abs(cents) < 30 ? "#00ff88" : "#ff4757";
                }
            }
        } else {
            // Si no hay volumen, mostramos que está en silencio
            document.getElementById('freqDisplay').innerText = "Esperando sonido...";
        }
    }

    function autoCorrelate(buf, sampleRate) {
        // Algoritmo de detección optimizado
        let SIZE = buf.length;
        let c = new Array(SIZE).fill(0);
        for (let i=0; i<SIZE; i++)
            for (let j=0; j<SIZE-i; j++)
                c[i] = c[i] + buf[j]*buf[j+i];

        let d=0; while (c[d]>c[d+1]) d++;
        let maxval=-1, maxpos=-1;
        for (let i=d; i<SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        return sampleRate/maxpos;
    }
</script>
