<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solfeo Pro</title>
    <style>
        /* Estilos simplificados para evitar conflictos en Android */
        body { 
            margin: 0; 
            padding: 20px; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #2d2d2d;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .target-box {
            background: #007bff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .target-note { font-size: 4rem; font-weight: bold; display: block; }
        
        .user-view { 
            margin: 20px 0; 
            padding: 15px; 
            border: 2px solid #444; 
            border-radius: 15px; 
        }
        .current-note { font-size: 3rem; color: #00ff88; font-weight: bold; }
        
        .meter-container { 
            position: relative; 
            width: 100%; 
            height: 30px; 
            background: #444; 
            border-radius: 15px; 
            margin: 20px 0; 
            overflow: hidden;
        }
        .center-mark { 
            position: absolute; left: 50%; width: 4px; height: 100%; 
            background: #00ff88; transform: translateX(-50%); z-index: 1;
        }
        .pointer { 
            position: absolute; top: 0; left: 50%; width: 10px; height: 100%; 
            background: #ff4757; z-index: 2; border-radius: 5px;
        }
        
        button { 
            background: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 20px; 
            border-radius: 15px; 
            font-size: 1.2rem; 
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        #freqDisplay { color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="target-box">
        <div style="font-size: 0.9rem;">CANTA ESTA NOTA:</div>
        <div class="target-note" id="targetNoteDisplay">--</div>
    </div>

    <div class="user-view">
        <div style="font-size: 0.9rem; color: #ccc;">TU VOZ:</div>
        <div class="current-note" id="userNoteDisplay">--</div>
        <div id="freqDisplay">0 Hz</div>
    </div>

    <div class="meter-container">
        <div class="center-mark"></div>
        <div id="pointer" class="pointer"></div>
    </div>

    <button id="btnMain">EMPEZAR / SIGUIENTE</button>
</div>

<script>
    const noteNamesES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
    const targetNotes = [
        { name: "Do", freq: 261.63 }, { name: "Re", freq: 293.66 },
        { name: "Mi", freq: 329.63 }, { name: "Fa", freq: 349.23 },
        { name: "Sol", freq: 392.00 }, { name: "La", freq: 440.00 },
        { name: "Si", freq: 493.88 }
    ];

    let audioCtx = null;
    let analyser = null;
    let currentTarget = null;
    let buffer = new Float32Array(2048);

    const btn = document.getElementById('btnMain');
    const targetDisplay = document.getElementById('targetNoteDisplay');
    const userDisplay = document.getElementById('userNoteDisplay');
    const freqDisplay = document.getElementById('freqDisplay');
    const pointer = document.getElementById('pointer');

    btn.onclick = async () => {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                update();
            } catch (err) {
                alert("Error de micro: " + err);
            }
        }
        
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        currentTarget = targetNotes[Math.floor(Math.random() * targetNotes.length)];
        targetDisplay.innerText = currentTarget.name;
    };

    function update() {
        requestAnimationFrame(update);
        analyser.getFloatTimeDomainData(buffer);
        
        // Calcular volumen
        let sum = 0;
        for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
        let vol = Math.sqrt(sum / buffer.length);

        if (vol > 0.01) {
            const freq = autoCorrelate(buffer, audioCtx.sampleRate);
            if (freq !== -1 && freq > 50 && freq < 1000) {
                const n = 12 * Math.log2(freq / 440) + 69;
                const noteIndex = Math.round(n) % 12;
                userDisplay.innerText = noteNamesES[(noteIndex + 12) % 12];
                freqDisplay.innerText = Math.round(freq) + " Hz";

                if (currentTarget) {
                    const cents = 1200 * Math.log2(freq / currentTarget.freq);
                    let pos = 50 + (cents / 2);
                    pos = Math.max(5, Math.min(95, pos));
                    pointer.style.left = pos + "%";
                }
            }
        } else {
            userDisplay.innerText = "--";
            pointer.style.left = "50%";
        }
    }

    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let c = new Array(SIZE).fill(0);
        for (let i=0; i<SIZE; i++)
            for (let j=0; j<SIZE-i; j++)
                c[i] = c[i] + buf[j]*buf[j+i];

        let d=0; while (c[d]>c[d+1]) d++;
        let maxval=-1, maxpos=-1;
        for (let i=d; i<SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        return sampleRate/maxpos;
    }
</script>
</body>
</html>
