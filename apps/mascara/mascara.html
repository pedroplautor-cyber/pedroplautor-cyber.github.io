<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor PNG con Croma Negro</title>
    <style>
        :root { --primary: #007AFF; --success: #34c759; --bg: #f5f5f7; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none;
        }
        .app-card {
            width: 100%; max-width: 450px;
            background: white; padding: 20px;
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 5px; font-weight: bold; }
        
        .check-container {
            display: flex; align-items: center; gap: 10px;
            background: #f0f0f0; padding: 10px; border-radius: 10px;
            margin-bottom: 15px; cursor: pointer;
        }
        .check-container input { width: 20px; height: 20px; }

        .preview-container {
            width: 100%; aspect-ratio: 1/1;
            background: #e0e0e0; border-radius: 12px;
            margin: 15px 0; overflow: hidden;
            position: relative; border: 1px solid #ddd;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { max-width: 100%; max-height: 100%; touch-action: none; background-image: 
            linear-gradient(45deg, #ccc 25%, transparent 25%), 
            linear-gradient(-45deg, #ccc 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #ccc 75%),
            linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
        
        input[type="range"] { width: 100%; margin: 10px 0; }
        button {
            width: 100%; padding: 15px; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600;
            color: white; cursor: pointer; background: var(--success);
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="field">
        <label>1. Fondo (Base)</label>
        <input type="file" id="bg-input" accept="image/*">
    </div>
    <div class="field">
        <label>2. Overlay (PNG/Negro)</label>
        <input type="file" id="fg-input" accept="image/*">
    </div>

    <label class="check-container">
        <input type="checkbox" id="remove-black">
        <span>Hacer negro transparente</span>
    </label>

    <div class="field" id="zoom-control" style="display:none">
        <label>Zoom del Fondo:</label>
        <input type="range" id="zoom-range" min="0.1" max="3" step="0.01" value="1">
    </div>

    <div class="preview-container">
        <canvas id="canvas"></canvas>
    </div>

    <button id="btn-download" style="display:none">Guardar Resultado</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const zoomRange = document.getElementById('zoom-range');
    const removeBlackCheck = document.getElementById('remove-black');
    
    let imgBg = null, imgFg = null;
    let posX = 0, posY = 0, scale = 1;
    let isDragging = false, lastX, lastY;

    const setupImage = (input, callback) => {
        input.onchange = (e) => {
            if (!e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { callback(img); draw(); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };
    };

    setupImage(document.getElementById('bg-input'), (img) => {
        imgBg = img;
        document.getElementById('zoom-control').style.display = 'block';
        canvas.width = img.width;
        canvas.height = img.height;
        document.getElementById('btn-download').style.display = 'block';
    });

    setupImage(document.getElementById('fg-input'), (img) => imgFg = img);

    removeBlackCheck.onchange = () => draw();

    function draw() {
        if (!imgBg) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Dibujar Fondo
        ctx.save();
        ctx.translate(posX, posY);
        ctx.scale(scale, scale);
        ctx.drawImage(imgBg, 0, 0);
        ctx.restore();

        // 2. Dibujar Overlay
        if (imgFg) {
            if (removeBlackCheck.checked) {
                // Dibujar overlay en un canvas temporal para procesar píxeles
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(imgFg, 0, 0, canvas.width, canvas.height);

                const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    // Si el color es muy oscuro (umbral de 40 para evitar bordes duros)
                    if (r < 40 && g < 40 && b < 40) {
                        data[i + 3] = 0; // Hacer transparente (Alpha = 0)
                    }
                }
                tCtx.putImageData(imgData, 0, 0);
                ctx.drawImage(tempCanvas, 0, 0);
            } else {
                ctx.drawImage(imgFg, 0, 0, canvas.width, canvas.height);
            }
        }
    }

    // Interacciones (Mouse & Touch)
    const start = (e) => {
        isDragging = true;
        const p = e.touches ? e.touches[0] : e;
        lastX = p.clientX; lastY = p.clientY;
    };
    const move = (e) => {
        if (!isDragging || !imgBg) return;
        const p = e.touches ? e.touches[0] : e;
        posX += (p.clientX - lastX);
        posY += (p.clientY - lastY);
        lastX = p.clientX; lastY = p.clientY;
        draw();
    };
    const end = () => isDragging = false;

    canvas.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start);
    window.addEventListener('touchmove', move);
    window.addEventListener('touchend', end);

    zoomRange.oninput = (e) => { scale = parseFloat(e.target.value); draw(); };
    document.getElementById('btn-download').onclick = () => {
        const link = document.createElement('a');
        link.download = 'resultado.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    };
</script>

</body>
</html>
