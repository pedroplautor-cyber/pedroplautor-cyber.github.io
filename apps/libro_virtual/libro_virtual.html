<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMaker Pro - Markdown Edition</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baskervvville&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #121214;
            --card-bg: #1e1e1e;
            --page-bg: #fdfaf3;
            --ink-color: rgba(58, 58, 58, 0.9);
            --grid-color: rgba(108, 92, 231, 0.08);
        }

        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA DE HERRAMIENTAS */
        .top-bar {
            padding: 10px;
            display: flex;
            gap: 10px;
            background: #000;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-edit { background: #fdcb6e; color: #000; }
        .btn-play { background: #00b894; color: white; }
        .btn-io { background: #0984e3; color: white; }
        .btn-rec { background: #d63031; color: white; }

        /* MODO EDICIÓN */
        #editor-zone { flex: 1; padding: 20px; overflow-y: auto; display: block; }
        .edit-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #333; 
            max-width: 800px;
            margin: 0 auto 20px;
        }
        
        input[type="text"], textarea { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            background: #2d2d2d; 
            color: #fff; 
            border: 1px solid #444;
        }

        textarea { font-family: monospace; min-height: 300px; resize: vertical; }
        
        /* MODO REPRODUCCIÓN */
        #player-zone {
            flex: 1;
            display: none;
            perspective: 2000px;
            align-items: center;
            justify-content: center;
            background: #1a1a1b;
        }

        .book {
            width: 450px;
            height: 650px;
            position: relative;
            transform-style: preserve-3d;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            background: var(--page-bg);
            color: var(--ink-color);
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.1), 2px 0 15px rgba(0,0,0,0.5);
            backface-visibility: hidden;
            border-radius: 2px 10px 10px 2px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .page.flipped { transform: rotateY(-180deg); }
        
        .page.notebook-mode {
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 25px 25px;
            border-left: 15px solid #e2ddd3;
        }

        /* MINI PORTADA EN PÁGINAS */
        .mini-thumb {
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            align-self: flex-end;
        }

        .markdown-content { font-family: 'Baskervvville', serif; font-size: 1.1rem; flex-grow: 1; overflow-y: auto; }
        .page-number { position: absolute; bottom: 20px; right: 30px; font-weight: bold; opacity: 0.5; }

        .page.cover { justify-content: center; align-items: center; background: #2c3e50; color: white; text-align: center; }
        .cover-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.5; }

        #rec-indicator {
            position: fixed; top: 75px; right: 20px; color: #ff7675; display: none; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.9); padding: 10px 20px; border-radius: 30px; font-weight: bold; z-index: 2000;
        }
        .dot { width: 12px; height: 12px; background: red; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-edit" onclick="showMode('edit')">✍️ Editor</button>
        <button class="btn-play" onclick="showMode('play')">▶️ Ver Libro</button>
        <button class="btn-io" onclick="exportData()">💾 Guardar JSON</button>
        <button class="btn-io" onclick="document.getElementById('importFile').click()">📂 Cargar JSON</button>
        <button class="btn-rec" onclick="toggleCapture()">🔴 Grabar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>

    <div id="rec-indicator"><div class="dot"></div> GRABANDO</div>

    <div id="editor-zone">
        <div class="edit-card">
            <label>Título del Libro:</label>
            <input type="text" id="in-title" placeholder="Escribe el título aquí...">
            
            <label style="margin-top:15px; display:block;">Imagen de Portada:</label>
            <input type="file" id="in-image" accept="image/*" onchange="handleImage(event)">
            
            <label style="margin-top:15px; display:block;">
                <input type="checkbox" id="check-notebook" checked> Modo Libreta (Cuadrícula)
            </label>
        </div>

        <div class="edit-card">
            <label>Contenido Markdown (Usa '---' para separar páginas):</label>
            <textarea id="markdown-input" placeholder="Escribe tu contenido aquí... separa las páginas con tres guiones ---"></textarea>
        </div>
    </div>

    <div id="player-zone">
        <div class="book" id="book-container" onclick="nextPage()"></div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

        let bookData = {
            titulo: "",
            portadaBase64: "",
            rawMarkdown: "",
            esLibreta: true
        };

        let currentPage = 0;
        let isRecording = false;

        function handleImage(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => { bookData.portadaBase64 = reader.result; };
            if (file) reader.readAsDataURL(file);
        }

        async function renderBook() {
            const container = document.getElementById('book-container');
            bookData.titulo = document.getElementById('in-title').value || "Sin Título";
            bookData.rawMarkdown = document.getElementById('markdown-input').value;
            bookData.esLibreta = document.getElementById('check-notebook').checked;

            const notebookClass = bookData.esLibreta ? 'notebook-mode' : '';
            const pagesRaw = bookData.rawMarkdown.split(/\n---\n|---/);
            
            // Portada
            let html = `
                <div class="page cover" style="z-index: ${pagesRaw.length + 1}">
                    ${bookData.portadaBase64 ? `<img src="${bookData.portadaBase64}" class="cover-img">` : ''}
                    <h1>${bookData.titulo}</h1>
                    <p style="opacity: 0.7;">Haz clic para abrir</p>
                </div>
            `;

            // Páginas con miniatura
            pagesRaw.forEach((content, i) => {
                if (content.trim() === "") return;
                const renderedContent = marked.parse(content);
                html += `
                    <div class="page ${notebookClass}" style="z-index: ${pagesRaw.length - i}">
                        ${bookData.portadaBase64 ? `<img src="${bookData.portadaBase64}" class="mini-thumb">` : '<div style="height:20px"></div>'}
                        <div class="markdown-content">${renderedContent}</div>
                        <div class="page-number">${i + 1}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            currentPage = 0;
            
            setTimeout(async () => { await mermaid.run(); }, 100);
        }

        function showMode(mode) {
            if(mode === 'play') {
                renderBook().then(() => {
                    document.getElementById('editor-zone').style.display = 'none';
                    document.getElementById('player-zone').style.display = 'flex';
                });
            } else {
                document.getElementById('editor-zone').style.display = 'block';
                document.getElementById('player-zone').style.display = 'none';
            }
        }

        function nextPage() {
            const pages = document.querySelectorAll('.page');
            if(currentPage < pages.length) {
                pages[currentPage].classList.add('flipped');
                currentPage++;
            } else {
                pages.forEach(p => p.classList.remove('flipped'));
                currentPage = 0;
            }
        }

        function exportData() {
            bookData.titulo = document.getElementById('in-title').value;
            bookData.rawMarkdown = document.getElementById('markdown-input').value;
            bookData.esLibreta = document.getElementById('check-notebook').checked;
            const blob = new Blob([JSON.stringify(bookData)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `libro.json`;
            a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                document.getElementById('in-title').value = data.titulo;
                document.getElementById('markdown-input').value = data.rawMarkdown;
                document.getElementById('check-notebook').checked = data.esLibreta;
                bookData = data;
                alert("Proyecto cargado.");
            };
            reader.readAsText(e.target.files[0]);
        }

        async function toggleCapture() {
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, {type: 'video/webm'});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = `captura.webm`; a.click();
                    };
                    recorder.start();
                    isRecording = true;
                    document.getElementById('rec-indicator').style.display = 'flex';
                } catch(e) { console.error(e); }
            } else {
                location.reload(); 
            }
        }
    </script>
</body>
</html>
