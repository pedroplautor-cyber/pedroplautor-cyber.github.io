<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Loop Pro</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
            --selection: #fde047;
            --stop: #ef4444;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* UNIGRAMA ESTRECHO */
        #viewport {
            flex: 0 0 100px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            background: rgba(0,0,0,0.3);
            border-bottom: 2px solid #334155;
            padding: 0 15px;
        }

        .staff-line {
            height: 2px;
            background-color: rgba(248, 250, 252, 0.4);
            min-width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .figure-item {
            font-size: 2rem;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid transparent;
            touch-action: none;
        }

        .figure-item.selected {
            border-color: var(--selection);
            background: rgba(253, 224, 71, 0.1);
        }

        .dotted::after {
            content: "•";
            color: #fbbf24;
            font-size: 1.2rem;
            vertical-align: super;
        }

        /* PANEL DE CONTROLES */
        .controls {
            flex: 1;
            background: var(--card);
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .btn {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 6px 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.55rem;
        }

        .btn span:first-child { font-size: 1.2rem; line-height: 1; }

        .dot-btn {
            grid-column: span 5;
            flex-direction: row !important;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: #2d3748;
            border: 1px dashed var(--selection);
            color: var(--selection);
            font-weight: bold;
        }

        /* TRANSPORTE (PLAY, STOP, LOOP) */
        .transport {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 20 px;
            padding-bottom: 10px;
        }

        .t-btn {
            border: none;
            border-radius: 10px;
            padding: 15px 5px;
            font-weight: bold;
            color: white;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .play { background: var(--accent); }
        .stop { background: var(--stop); }
        .loop-toggle { background: #475569; }
        .loop-toggle.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        
        .del-btn { background: #64748b; grid-column: span 3; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; color: white; font-size: 0.7rem;}

        .playing { color: var(--accent) !important; transform: scale(1.3); filter: drop-shadow(0 0 5px var(--accent)); }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="staff-line" id="staff"></div>
    </div>

    <div class="controls">
        <div class="grid">
            <button class="btn" onclick="handleInput('𝅝', 4, false)"><span>𝅝</span>1/1</button>
            <button class="btn" onclick="handleInput('𝅗𝅥', 2, false)"><span>𝅗𝅥</span>1/2</button>
            <button class="btn" onclick="handleInput('𝅘𝅥', 1, false)"><span>𝅘𝅥</span>1/4</button>
            <button class="btn" onclick="handleInput('𝅘𝅥𝅮', 0.5, false)"><span>𝅘𝅥𝅮</span>1/8</button>
            <button class="btn" onclick="handleInput('𝅘𝅥𝅯', 0.25, false)"><span>𝅘𝅥𝅯</span>1/16</button>
            
            <button class="btn" onclick="handleInput('𝄻', 4, true)"><span>𝄻</span>S1/1</button>
            <button class="btn" onclick="handleInput('𝄼', 2, true)"><span>𝄼</span>S1/2</button>
            <button class="btn" onclick="handleInput('𝄽', 1, true)"><span>𝄽</span>S1/4</button>
            <button class="btn" onclick="handleInput('𝄾', 0.5, true)"><span>𝄾</span>S1/8</button>
            <button class="btn" onclick="handleInput('𝄿', 0.25, true)"><span>𝄿</span>S1/16</button>

            <button class="btn dot-btn" onclick="toggleDot()"><span>•</span> PUNTILLO</button>
        </div>

        <div class="transport">
            <button class="t-btn play" id="playBtn" onclick="startPlayback()"><span>▶</span>PLAY</button>
            <button class="t-btn stop" onclick="stopPlayback()"><span>■</span>STOP</button>
            <button class="t-btn loop-toggle" id="loopBtn" onclick="toggleLoop()"><span>∞</span>LOOP</button>
            
            <button class="del-btn" onclick="deleteTarget()">BORRAR ELEMENTO O ÚLTIMO</button>
        </div>
		
		
    </div>

    <script>
        let composition = [];
        let selectedIndex = -1;
        let isPlaying = false;
        let isLooping = false;
        let currentTimeout = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function render() {
            const staff = document.getElementById('staff');
            staff.innerHTML = '';
            composition.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = `figure-item ${item.hasDot ? 'dotted' : ''} ${selectedIndex === i ? 'selected' : ''}`;
                el.innerHTML = item.symbol;
                el.setAttribute('data-index', i);
                el.onclick = (e) => { e.stopPropagation(); selectedIndex = (selectedIndex === i) ? -1 : i; render(); };
                staff.appendChild(el);
            });
        }

        function handleInput(symbol, baseDur, isRest) {
            if (selectedIndex === -1) {
                composition.push({ symbol, baseDur, isRest, hasDot: false });
                setTimeout(() => { document.getElementById('viewport').scrollLeft = 9999; }, 50);
            } else {
                const wasDotted = composition[selectedIndex].hasDot;
                composition[selectedIndex] = { symbol, baseDur, isRest, hasDot: wasDotted };
            }
            render();
        }

        function toggleDot() {
            if (selectedIndex !== -1) {
                composition[selectedIndex].hasDot = !composition[selectedIndex].hasDot;
                render();
            }
        }

        function toggleLoop() {
            isLooping = !isLooping;
            document.getElementById('loopBtn').classList.toggle('active', isLooping);
        }

        function deleteTarget() {
            if (selectedIndex !== -1) {
                composition.splice(selectedIndex, 1);
                selectedIndex = -1;
            } else {
                composition.pop();
            }
            render();
        }

        async function startPlayback() {
            if (isPlaying || composition.length === 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isPlaying = true;
            document.getElementById('playBtn').style.opacity = "0.5";
            
            do {
                const elements = document.querySelectorAll('.figure-item');
                for (let i = 0; i < composition.length; i++) {
                    if (!isPlaying) break;
                    
                    const item = composition[i];
                    elements[i].classList.add('playing');
                    
                    if (!item.isRest) {
                        const osc = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                        osc.connect(g); g.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    }
                    
                    const duration = (item.hasDot ? item.baseDur * 1.5 : item.baseDur) * 400;
                    await new Promise(r => { currentTimeout = setTimeout(r, duration); });
                    elements[i].classList.remove('playing');
                }
            } while (isLooping && isPlaying);
            
            stopPlayback();
        }

        function stopPlayback() {
            isPlaying = false;
            clearTimeout(currentTimeout);
            document.getElementById('playBtn').style.opacity = "1";
            document.querySelectorAll('.figure-item').forEach(el => el.classList.remove('playing'));
        }

        document.getElementById('viewport').onclick = () => { selectedIndex = -1; render(); };
        render();
    </script>
</body>
</html>
