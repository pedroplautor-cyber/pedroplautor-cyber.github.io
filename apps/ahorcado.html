<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick-Hangman: Pelo Rizado Edition - Imagen Revelada</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        #game-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        #image-container {
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
            position: relative;
            width: 200px;
            height: 200px;
            overflow: hidden;
            margin-left: auto;
            margin-right: auto;
        }

        #hangman-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Oculta la imagen inicialmente */
        }

        #image-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa; /* Color de fondo inicial */
            transition: height 0.3s ease-in-out; /* Transición para revelar suavemente */
        }

        #word-display {
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            margin: 20px 0;
            font-family: monospace;
            font-weight: bold;
        }

        #keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(35px, 1fr));
            gap: 5px;
            margin-top: 20px;
        }

        button.letter {
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            transition: 0.2s;
        }

        button.letter:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            height: 1.5rem;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

            <div id="image-mask"></div>
        </div>
        
        <div id="word-display">_ _ _ _ _</div>
        
        <div id="message"></div>
        
        <div id="keyboard"></div>
        
        <button class="reset-btn" onclick="initGame()">Nueva Partida</button>
    </div>

    <script>
        const words = [
            "ABACATE", "ACERTIJO", "AQUILON", "AVENTURA", "BALONCESTO", 
            "BICICLETA", "CALABAZA", "CAMALEON", "DESTREZA", "DIAMANTE",
            "EDIFICIO", "ELEFANTE", "ESCORPION", "ESMERALDA", "ESPECTRO",
            "FLAMENCO", "GALAXIA", "GUITARRA", "HELICOPTERO", "HORIZONTE",
            "IMAN", "INVIERNO", "JIRAFA", "JUVENTUD", "KILOGRAMO",
            "LABERINTO", "LAMPARA", "LUCIERNAGA", "MARIPOSA", "METEORITO",
            "MONTAÑA", "NEBULOSA", "ORQUIDEA", "PANDEMIA", "PANTALON",
            "PIRAMIDE", "PLANETA", "QUIMICA", "RELAMPAGO", "SARCASMO",
            "SILENCIO", "TELEFONO", "TORNADO", "UNIVERSO", "VELOCIDAD",
            "VENTANA", "XILOFONO", "YACIMIENTO", "ZAPATO", "ZODIACO"
        ];

        let selectedWord = "";
        let guessedLetters = [];
        let mistakes = 0;
        const maxMistakes = 7;

        const image = document.getElementById('hangman-image');
        const mask = document.getElementById('image-mask');

        function initGame() {
            selectedWord = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            mistakes = 0;
            
            document.getElementById('message').innerText = "";
            document.getElementById('message').style.color = "black";
            
            setupKeyboard();
            updateDisplay();
            updateImageReveal();
            image.style.display = 'block'; // Asegura que la imagen sea visible
        }

        function setupKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = "";
            "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(letter => {
                const btn = document.createElement('button');
                btn.classList.add('letter');
                btn.innerText = letter;
                btn.onclick = () => handleGuess(letter, btn);
                keyboard.appendChild(btn);
            });
        }

        function handleGuess(letter, btn) {
            btn.disabled = true;
            if (selectedWord.includes(letter)) {
                guessedLetters.push(letter);
                updateDisplay();
                checkWin();
            } else {
                mistakes++;
                updateImageReveal();
                checkLoss();
            }
        }

        function updateDisplay() {
            const display = selectedWord.split("").map(l => 
                guessedLetters.includes(l) ? l : "_"
            ).join(" ");
            document.getElementById('word-display').innerText = display;
        }

        function checkWin() {
            if (!document.getElementById('word-display').innerText.includes("_")) {
                document.getElementById('message').innerText = "¡VICTORIA! K.O.";
                document.getElementById('message').style.color = "green";
                disableKeyboard();
            }
        }

        function checkLoss() {
            if (mistakes >= maxMistakes) {
                document.getElementById('message').innerText = `DERROTA. Era: ${selectedWord}`;
                document.getElementById('message').style.color = "red";
                disableKeyboard();
            }
        }

        function disableKeyboard() {
            document.querySelectorAll('.letter').forEach(btn => btn.disabled = true);
        }

        function updateImageReveal() {
            // Calcula la altura de la máscara en función de los errores
            const revealPercentage = (maxMistakes - mistakes) / maxMistakes;
            const maskHeight = 100 * revealPercentage;
            mask.style.height = maskHeight + '%';
        }

        initGame();
    </script>
